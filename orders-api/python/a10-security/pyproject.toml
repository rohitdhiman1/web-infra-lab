[project]
name = "orders-api"
version = "0.0.1"
description = "Web infra guide, API track: module A10 reference lab"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.143.2",
  "uvicorn==0.54.0",
  "pyjwt==2.15.1",
  "cryptography==50.0.2",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx2==2.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
