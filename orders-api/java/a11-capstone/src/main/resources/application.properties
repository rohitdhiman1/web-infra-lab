server.port=8080
# Postgres from compose.yaml (throwaway lab credentials)
spring.datasource.url=jdbc:postgresql://localhost:55432/orders?currentSchema=capstone
spring.datasource.username=lab
spring.datasource.password=lab
spring.sql.init.mode=always
# The fake card gateway's delay
gateway.delay-ms=0
# A10: who issues tokens, and who they are for
auth.issuer=https://id.orders.test
auth.audience=orders-api
auth.token-ttl-seconds=300
# Token bucket per client (credential, or IP)
ratelimit.capacity=100
ratelimit.refill-per-second=50
