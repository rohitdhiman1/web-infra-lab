# Local Postgres for the A3 lab. The credentials are throwaway lab values, not secrets.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d orders"]
      interval: 1s
      retries: 30
